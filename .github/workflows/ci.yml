name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, '1.99.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test debug
        run: cargo +${{ matrix.rust }} test --all-targets --locked
      - name: Test release
        run: cargo +${{ matrix.rust }} test --release --locked
      - name: Test documentation
        run: cargo +${{ matrix.rust }} test --doc --locked
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python3 scripts/check_package.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo package --locked
      - name: Benchmark smoke test
        run: cargo bench --bench convert -- --quick
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-unknown-unknown, aarch64-unknown-linux-gnu, thumbv7em-none-eabi]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - run: cargo check --lib --no-default-features --target ${{ matrix.target }} --locked
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      - name: Check parser and protocol lifetimes
        run: cargo +nightly miri test --lib
      - name: Check stream state transitions
        run: cargo +nightly miri test --test miri
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo test --manifest-path comparison/Cargo.toml --locked

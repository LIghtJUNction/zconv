[package]
name = "zconv"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
description = "Zero-dependency, allocation-free AI protocol conversion"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zconv"
readme = "README.md"
keywords = ["ai", "protocol", "no-std", "openai", "streaming"]
categories = ["no-std", "parser-implementations", "encoding"]
include = ["src/**", "examples/**", "tests/**", "benches/**", "README.md", "CHANGELOG.md", "LICENSE-*", "docs/**", "Cargo.toml"]

[lib]
path = "src/lib.rs"

[[bench]]
name = "convert"
harness = false

[[bench]]
name = "json"
harness = false

[[bench]]
name = "stream"
harness = false

[dependencies]

[dev-dependencies]

[build-dependencies]

[features]
default = []

[workspace]
resolver = "3"
members = ["."]
exclude = ["comparison", "fuzz"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
